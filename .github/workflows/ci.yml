name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOMAIN: homelab.local
  CERT_EMAIL: ci@homelab.local
  TZ: UTC

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config
          docker compose -f docker-compose.monitoring.yml config
          docker compose -f docker-compose.logging.yml config

      - name: ShellCheck scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error scripts/*.sh

      - name: Install Ansible
        run: |
          pip install "ansible-core>=2.15,<2.18"
          ansible-galaxy collection install \
            community.general \
            ansible.posix \
            community.docker

      - name: Validate Ansible syntax
        run: |
          ansible-playbook ansible/playbooks/setup-server.yml --syntax-check
          ansible-playbook ansible/playbooks/deploy-services.yml --syntax-check

  lint:
    name: Lint Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          hide-progress: true
          exit-code: "0"
          severity: CRITICAL,HIGH

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [validate, lint]
    env:
      # GitHub-hosted runners already bind :53 (systemd-resolved)
      ADGUARD_PORT: "5353"
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          echo "ADGUARD_PORT=${ADGUARD_PORT}" >> .env
      - name: Pull images
        run: |
          docker compose pull --quiet
          docker compose -f docker-compose.monitoring.yml pull --quiet
      - name: Start services
        run: |
          # Skip AdGuard in CI: static DNS IP / host port binding is lab-specific
          docker compose up -d traefik portainer uptime-kuma
          docker compose -f docker-compose.monitoring.yml up -d
      - name: Health check
        run: |
          sleep 20
          ./scripts/health-check.sh
      - name: Test backup
        run: |
          ./scripts/backup.sh
          test -n "$(ls -A backups/*.tar.gz 2>/dev/null || true)"
      - name: Cleanup
        if: always()
        run: docker compose down -v || true
