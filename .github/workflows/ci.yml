name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOMAIN: homelab.local
  CERT_EMAIL: ci@homelab.local
  TZ: UTC

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config
          docker compose -f docker-compose.monitoring.yml config
          docker compose -f docker-compose.logging.yml config

      - name: ShellCheck scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

      - name: Install Ansible
        run: pip install "ansible-core>=2.15,<2.18"

      - name: Validate Ansible syntax
        run: |
          ansible-playbook ansible/playbooks/setup-server.yml --syntax-check
          ansible-playbook ansible/playbooks/deploy-services.yml --syntax-check

  lint:
    name: Lint Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check YAML formatting
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml

      - name: Validate Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "config"
          hide-progress: true
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [validate, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Copy .env
        run: cp .env.example .env

      - name: Pull images
        run: |
          docker compose pull --quiet
          docker compose -f docker-compose.monitoring.yml pull --quiet

      - name: Start services
        run: |
          docker compose up -d
          docker compose -f docker-compose.monitoring.yml up -d

      - name: Health check
        run: |
          sleep 20
          ./scripts/health-check.sh

      - name: Test backup
        run: |
          ./scripts/backup.sh
          test -n "$(ls -A backups/*.tar.gz 2>/dev/null || true)"

      - name: Cleanup
        if: always()
        run: docker compose down -v || true
