# Traefik Service

service:
  image: traefik:v3.1
  container_name: traefik
  restart: unless-stopped
  ports:
    - "80:80"
    - "443:443"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./configs/traefik/traefik.yml:/traefik.yml
    - ./configs/traefik/config.yml:/config.yml
    - traefik-data:/data

volumes:
  traefik-data:
